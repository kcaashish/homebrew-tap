name: Bump neovim-nightly

on:
  schedule:
    # Neovim publishes the nightly build around 05:20 UTC.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bump the version stanza but do not push the commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bump-neovim-nightly

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Runner images pin Homebrew to whatever shipped when the image was built
      # (6.0.18 as of this writing). The cask's `postflight_steps` block uses the
      # `{{arch}}` install-step token, which landed after 6.0.22 and is in no
      # tagged release yet, so the pinned brew cannot even read the cask.
      #
      # A plain `brew update` is not enough: it sets HOMEBREW_UPDATE_TO_TAG and
      # checks out the newest tag, which is the version missing the token.
      # Developer mode takes the branch path instead and lands on main, which is
      # also where livecheck (a developer command) leaves a local install.
      - name: Update Homebrew
        env:
          HOMEBREW_DEVELOPER: 1
        run: brew update

      - name: Link the checkout as a tap
        run: |
          taps="$(brew --repository)/Library/Taps/kcaashish"
          mkdir -p "$taps"
          ln -sfn "$GITHUB_WORKSPACE" "$taps/homebrew-tap"

      - name: Check for a newer nightly
        id: livecheck
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          # Without `pipefail` the exit status below is jq's, so a livecheck that
          # dies still leaves `latest` empty, which reads as "no new nightly" and
          # keeps the job green. Prove the cask is readable first, then require
          # livecheck itself to succeed and to hand back JSON.
          set -o pipefail

          brew info --cask kcaashish/tap/neovim-nightly > /dev/null

          json="$(brew livecheck --cask --json --newer-only kcaashish/tap/neovim-nightly)"
          if ! jq -e 'type == "array"' > /dev/null <<< "$json"; then
            echo "::error::brew livecheck did not return a JSON array:"
            echo "$json"
            exit 1
          fi

          latest="$(jq -r '.[0].version.latest // empty' <<< "$json")"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ -z "${latest}" ]; then echo "Already on the newest nightly."; fi

      - name: Bump the version stanza
        if: steps.livecheck.outputs.latest != ''
        env:
          LATEST: ${{ steps.livecheck.outputs.latest }}
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          sed -i '' -E "s/^  version \".*\"\$/  version \"${LATEST}\"/" Casks/neovim-nightly.rb
          if git diff --quiet Casks/neovim-nightly.rb; then
            echo "::error::version stanza did not change"
            exit 1
          fi
          brew info --cask kcaashish/tap/neovim-nightly

      - name: Commit and push
        if: steps.livecheck.outputs.latest != ''
        env:
          LATEST: ${{ steps.livecheck.outputs.latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Author as the Actions bot: that email is not attached to a GitHub
          # account, so these commits stay off the contribution graph.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "neovim-nightly ${LATEST}"
          git --no-pager show --stat HEAD

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run requested: not pushing neovim-nightly ${LATEST}"
            exit 0
          fi
          # Dispatching from a branch is then a dry run by construction, so the
          # whole bump can be exercised without moving `main`.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::notice::Not on main (${GITHUB_REF}): not pushing neovim-nightly ${LATEST}"
            exit 0
          fi
          git push
